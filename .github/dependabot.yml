version: 2
# Monthly, grouped updates: one routine pull request with every minor and patch
# update per ecosystem, and majors in pull requests of their own. The exceptions
# below: package families that only work when they move together, Vaadin, and
# the npm packages that produce or ship what the published packages contain.
#
# A package that matches more than one group goes to the most specific one, not
# to the first one listed: GitHub's documentation still says "first", but the
# updater has scored the patterns since dependabot-core#14861 (May 2026). An
# exact name ('astro') scores 1000, a pattern with a wildcard about 100
# ('@astrojs/*' scores 95, 'com.vaadin:*' 97), the lone '*' 1, and a group
# without patterns 500. A routine group without patterns would therefore
# outrank every wildcard pattern: npm-minor-patch would take @astrojs/starlight
# out of docs-site, and maven-minor-patch would leave vaadin empty. So each
# routine group says patterns: ['*'] and keeps only what no other group claims.
# Groups whose update-types do not overlap, such as a *-major group and the
# routine group, do not compete: the package is in both, and the type of the
# update decides which one takes it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: America/Sao_Paulo
    # Once this many version-update pull requests are open, Dependabot opens no
    # new one. The six groups below can hold six at once, so 5 could keep the
    # routine one out; 10 leaves room for a few pull requests of their own, and
    # the backlog of majors arrives as the open ones are merged or closed.
    open-pull-requests-limit: 10
    labels: ['dependencies', 'javascript']
    groups:
      # Astro and Starlight move together, in their own pull request: a Starlight
      # 0.x "minor" can require a new Astro major (Starlight 0.42 needs Astro 7),
      # so on their own both pull requests would fail.
      docs-site:
        patterns: ['astro', '@astrojs/*']
      # Routine pull request: every other minor and patch update at once, which
      # also keeps all @vaadin/* web components on the same version. Out of it,
      # one pull request each, go the packages that produce or ship what the
      # published packages contain, so a change in that output points to a single
      # package: sharp renders the brand-assets PNG icons (it is 0.x, so 0.33 to
      # 0.35 counts as a minor), style-dictionary generates the tokens (CSS, JS,
      # JSON and Java), lucide-static is the source of the icon set (its 0.x
      # minors rename icons) and the @fontsource-variable fonts are copied into
      # brand-assets.
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
        exclude-patterns: ['sharp', 'style-dictionary', 'lucide-static', '@fontsource-variable/*']
      # Families whose majors only work together; their minor and patch updates
      # already move together in the routine pull request. Storybook packages
      # must share one version; stylelint-config-standard requires the stylelint
      # major it was made for (40 needs stylelint 17, 41 needs 18); @commitlint/cli
      # and @commitlint/config-conventional are released together; typescript-eslint
      # declares the eslint majors it supports. Any other major update gets a pull
      # request of its own.
      storybook-major:
        patterns: ['storybook', '@storybook/*', 'storybook-addon-*']
        update-types: ['major']
      stylelint-major:
        patterns: ['stylelint', 'stylelint-*']
        update-types: ['major']
      commitlint-major:
        patterns: ['@commitlint/*']
        update-types: ['major']
      eslint-major:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*']
        update-types: ['major']
    ignore:
      # This rule's premise is past: the Vaadin 25 wave is in production since
      # 2026-09-16 and the consumers (singularidade-ui-vaadin and the apps) run
      # Vaadin 25.2, while Storybook still renders the 24.x web components. Still
      # to decide: when Storybook moves to the 25.x web components, and to which
      # line (the consumers' 25.2, or the next one together with vaadin-bom), all
      # @vaadin/* packages in one pull request. Until then the rule stays: without
      # it every @vaadin/* package would get a major pull request of its own,
      # since the routine group takes only minor and patch.
      - dependency-name: '@vaadin/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ['dependencies', 'java']
    groups:
      # Vaadin (vaadin-bom, which brings flow-server) moves along the chain that
      # consumes vaadin-bindings, on one version end to end: this repository,
      # then singularidade-ui-vaadin, then the apps. In a pull request of its own
      # it can wait for that wave while the plugin updates of the routine pull
      # request merge on a green CI.
      vaadin:
        patterns: ['com.vaadin:*']
        update-types: ['minor', 'patch']
      # Routine pull request: every other minor and patch update at once; each
      # major gets a pull request of its own.
      maven-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # A Vaadin major moves only in a coordinated wave along that chain, as
      # Vaadin 25 did with Boot 4.1 (in production since 2026-09-16). Maven
      # artifacts are published only from a v* tag (release.yml), so a merge to
      # main reaches singularidade-ui-vaadin only with the next release.
      - dependency-name: 'com.vaadin:*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: '09:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels: ['dependencies', 'github_actions']
    groups:
      # Routine pull request: every minor and patch update at once; each major
      # gets a pull request of its own.
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
